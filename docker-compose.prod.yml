# 배포용 compose. EC2 에서는 CD 가 이미지를 pull 해서 띄운다(build 섹션은 로컬 검증용).
# 값은 같은 폴더의 .env 에서 읽는다 → infra/deploy/prod.env.example 참고.

x-backend-env: &backend-env
  SPRING_PROFILES_ACTIVE: prod
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USER: root
  SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN}
  # t3.small(메모리 2GB)에 백엔드 6개를 올리기 위한 힙 제한 (swap 4GB 전제)
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms64m -Xmx200m -XX:MaxMetaspaceSize=150m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1}

x-backend: &backend
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --max-connections=80
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # 127.0.0.1(TCP)로 확인해야 초기화 중 임시 서버를 healthy 로 오판하지 않는다
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  identity-service:
    <<: *backend
    image: ${REGISTRY:-ghcr.io/likelion-backend-24th}/fpt1-identity-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      args:
        SERVICE: identity-service
    environment:
      <<: *backend-env
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@team1.local}
      SUPER_ADMIN_PASSWORD_HASH: ${SUPER_ADMIN_PASSWORD_HASH}
      # 카카오 로그인 인가 코드 교환용 REST API 키. 비어 있으면 카카오 로그인만 동작 안 함
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      # REST 키에 클라이언트 시크릿이 켜져 있으면 그 값도 필요(카카오 신규 앱 기본 활성화)
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      # 네이버 로그인 인가 코드 교환용 Client ID/Secret. 비어 있으면 네이버 로그인만 동작 안 함
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}

  expo-service:
    <<: *backend
    image: ${REGISTRY:-ghcr.io/likelion-backend-24th}/fpt1-expo-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      args:
        SERVICE: expo-service
    environment:
      <<: *backend-env
      # portone-live: MockPgClient 대신 PortOneClient 로 결제를 실제 조회한다(키는 테스트 채널).
      # 빠지면 결제 확인 없이 무조건 PAID 가 되므로 운영에서는 반드시 켠다.
      SPRING_PROFILES_ACTIVE: ${PAYMENT_SERVICE_PROFILES:-prod,portone-live}
      RESERVATION_SERVICE_URL: http://reservation-service:8083
      # 박람회 공개 시 태깅 이벤트(#234). 없으면 localhost 로 가서 조용히 실패하고 태그가 생기지 않는다.
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8085
      # 자연어 검색(#261). 빠지면 검색이 조용히 키워드 폴백만 하고 해석 칩이 안 뜬다.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      APP_BASE_URL: ${APP_BASE_URL}
      PORTONE_STORE_ID: ${PORTONE_STORE_ID}
      PORTONE_CHANNEL_KEY: ${PORTONE_CHANNEL_KEY}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET}
      PORTONE_WEBHOOK_SECRET: ${PORTONE_WEBHOOK_SECRET}

  reservation-service:
    <<: *backend
    image: ${REGISTRY:-ghcr.io/likelion-backend-24th}/fpt1-reservation-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      args:
        SERVICE: reservation-service
    environment:
      <<: *backend-env
      # expo-service 와 같은 이유로 PortOneClient 를 쓴다
      SPRING_PROFILES_ACTIVE: ${PAYMENT_SERVICE_PROFILES:-prod,portone-live}
      EXPO_SERVICE_URL: http://expo-service:8082
      TICKET_SERVICE_URL: http://ticket-service:8084
      # 예약 확정 이벤트(#184). 없으면 localhost 로 보내다 실패하고 확정 알림이 오지 않는다.
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8085
      PORTONE_STORE_ID: ${PORTONE_STORE_ID}
      PORTONE_CHANNEL_KEY: ${PORTONE_CHANNEL_KEY}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET}
      PORTONE_WEBHOOK_SECRET: ${PORTONE_WEBHOOK_SECRET}
      # 캘린더 추천의 시간·카테고리 조건 해석(GeminiConstraintParser). 없으면 isAvailable() 이
      # 항상 false 라 Gemini 경로를 안 타고 정규식 폴백(시간만, 카테고리는 못 읽음)으로만 동작한다.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}

  ticket-service:
    <<: *backend
    image: ${REGISTRY:-ghcr.io/likelion-backend-24th}/fpt1-ticket-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      args:
        SERVICE: ticket-service
    environment:
      <<: *backend-env
      EXPO_SERVICE_URL: http://expo-service:8082
      # 체크인 시간창(#198)이 회차 시각을 조회한다. 없으면 localhost 로 가서 실패하고,
      # fail-open 이라 오류 없이 시간창 검증만 조용히 건너뛴다.
      RESERVATION_SERVICE_URL: http://reservation-service:8083
      # 체크인 완료 이벤트(#185)를 보낸다. fail-open 이라 없어도 체크인은 되지만 추천 기록이 빠진다.
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8085
      # 체크인 결과 AI 요약(#259). 비어 있으면 요약 문장만 빠지고 집계 숫자는 그대로 나온다.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}

  recommendation-service:
    <<: *backend
    image: ${REGISTRY:-ghcr.io/likelion-backend-24th}/fpt1-recommendation-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      args:
        SERVICE: recommendation-service
    environment:
      <<: *backend-env
      # 알림 배치가 공개 박람회 목록을 받아 온다(#234)
      EXPO_SERVICE_URL: http://expo-service:8082
      # 비어 있으면 태깅이 UNTAGGED 로 떨어질 뿐 서비스는 뜬다
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # JVM 6개째라 힙을 다른 서비스(200m)보다 작게 준다
      JAVA_TOOL_OPTIONS: -Xms48m -Xmx160m -XX:MaxMetaspaceSize=128m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1

  settlement-service:
    restart: unless-stopped
    image: ${REGISTRY:-ghcr.io/likelion-backend-24th}/fpt1-settlement-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      args:
        SERVICE: settlement-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      RESERVATION_SERVICE_URL: http://reservation-service:8083
      EXPO_SERVICE_URL: http://expo-service:8082
      # 정산 기간 AI 요약(GeminiSettlementSummaryService). 없으면 isAvailable() 이
      # 항상 false 라 요약 없이 숫자만 보여준다(fail-open).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms64m -Xmx200m -XX:MaxMetaspaceSize=150m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1}

  web:
    image: ${REGISTRY:-ghcr.io/likelion-backend-24th}/fpt1-web:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_PORTONE_STORE_ID: ${PORTONE_STORE_ID}
        VITE_PORTONE_CHANNEL_KEY: ${PORTONE_CHANNEL_KEY}
        # 구글 소셜 로그인 클라이언트 ID(공개 값). 비어 있으면 구글 로그인 버튼이 숨는다.
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        # 네이버 소셜 로그인 클라이언트 ID(공개 값). 비어 있으면 네이버 로그인 버튼이 숨는다.
        VITE_NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
        # 카카오 소셜 로그인 REST API 키(공개 값, 인가 URL client_id). 비어 있으면 카카오 로그인 버튼이 숨는다.
        VITE_KAKAO_REST_KEY: ${KAKAO_REST_KEY:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_TLS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # 더미 데이터용 홍보 이미지 등 정적 파일. 서버의 ~/fpt1/media 를 /media 경로로 서빙한다.
      - ./media:/usr/share/nginx/html/media:ro
      # 호스트 certbot 이 발급한 인증서 (live/ 가 archive/ 를 가리키는 링크라 폴더 전체를 마운트)
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    depends_on:
      - identity-service
      - expo-service
      - reservation-service
      - ticket-service

volumes:
  mysql_data:
