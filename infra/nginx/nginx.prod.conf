# 배포용 설정. web 컨테이너의 /etc/nginx/conf.d/default.conf 로 마운트된다.
# 라우팅은 로컬용 nginx.conf 와 같고, 대상만 컨테이너 이름으로 바꿨다.
# proxy_pass 에 변수를 쓰는 이유: 재배포로 컨테이너 IP 가 바뀌어도 다시 조회하게 하려고(안 쓰면 502).
#
# HTTPS: 인증서는 EC2 호스트의 certbot 이 발급·갱신하고(/etc/letsencrypt), 컨테이너는 읽기만 한다.
# 인증서가 없으면 nginx 가 뜨지 않으므로, 이 설정을 배포하기 전에 infra/deploy/https-setup.sh 로 먼저 발급한다.

# http 는 전부 https 로 보낸다
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name expohub.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/expohub.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/expohub.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 10m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Trace-Id $request_id;

    set $identity    http://identity-service:8081;
    set $expo        http://expo-service:8082;
    set $reservation http://reservation-service:8083;
    set $ticket      http://ticket-service:8084;
    set $settlement       http://settlement-service:8086;
    set $recommendation   http://recommendation-service:8085;

    location /internal/ {
        return 404;
    }

    location /api/v1/auth/ {
        proxy_pass $identity;
    }

    location /api/v1/admin/ {
        proxy_pass $identity;
    }

    location /api/v1/users/ {
        proxy_pass $identity;
    }

    location /api/v1/me/interests {
        proxy_pass $recommendation;
    }

    location /api/v1/me/recommendations {
        proxy_pass $recommendation;
    }

    location /api/v1/me/notifications {
        proxy_pass $recommendation;
    }

    # 박람회 상세 조회 이벤트 - 없으면 /api/v1/me/ 에 걸려 identity 로 가서 404 가 난다
    location /api/v1/me/views/ {
        proxy_pass $recommendation;
    }

    location /api/v1/me/calendar/ {
        proxy_pass $reservation;
    }

    location /api/v1/calendar/ {
        proxy_pass $reservation;
    }

    location /api/v1/me/ {
        proxy_pass $identity;
    }

    location /api/v1/admin/settlement {
        proxy_pass $settlement;
    }

    location /api/v1/expos/tags/bulk {
        proxy_pass $recommendation;
    }

    location ~ ^/api/v1/expos/[^/]+/similar$ {
        proxy_pass $recommendation;
    }

    location ~ ^/api/v1/expos/[^/]+/tags$ {
        proxy_pass $recommendation;
    }

    location ~ ^/api/v1/expos/[^/]+/rounds(/.*)?$ {
        proxy_pass $reservation;
    }

    location /api/v1/expos {
        proxy_pass $expo;
    }

    location /api/v1/channels {
        proxy_pass $expo;
    }

    location /api/v1/expo-promotions {
        proxy_pass $expo;
    }

    location /api/v1/rounds {
        proxy_pass $reservation;
    }

    location /api/v1/reservations {
        proxy_pass $reservation;
    }

    location /api/v1/tickets {
        proxy_pass $ticket;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
