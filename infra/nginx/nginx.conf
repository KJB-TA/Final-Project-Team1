events {}

# 로컬 개발용 설정입니다. host.docker.internal은 서비스가 컨테이너 밖(IntelliJ)에서 실행 중일 때만 유효합니다.
# 배포 시 서비스가 컨테이너화되면 host.docker.internal → 컨테이너 이름(identity-service 등)으로 교체 필요.

http {
    server {
        listen 80;
        proxy_set_header X-Trace-Id $request_id;

        location /api/v1/auth/ {
            proxy_pass http://host.docker.internal:8081;
        }

        location /api/v1/admin/ {
            proxy_pass http://host.docker.internal:8081;
        }

        location /api/v1/users/ {
            proxy_pass http://host.docker.internal:8081;
        }

        location /api/v1/me/interests {
            proxy_pass http://host.docker.internal:8085;
        }

        location /api/v1/me/recommendations {
            proxy_pass http://host.docker.internal:8085;
        }

        location /api/v1/me/notifications {
            proxy_pass http://host.docker.internal:8085;
        }

        location /api/v1/me/views/ {
            proxy_pass http://host.docker.internal:8085;
        }

        location /api/v1/me/calendar/ {
            proxy_pass http://host.docker.internal:8083;
        }

        location /api/v1/calendar/ {
            proxy_pass http://host.docker.internal:8083;
        }

        location /api/v1/me/ {
            proxy_pass http://host.docker.internal:8081;
        }

        location /api/v1/expos/tags/bulk {
            proxy_pass http://host.docker.internal:8085;
        }

        location ~ ^/api/v1/expos/[^/]+/similar$ {
            proxy_pass http://host.docker.internal:8085;
        }

        location ~ ^/api/v1/expos/[^/]+/tags$ {
            proxy_pass http://host.docker.internal:8085;
        }

        location ~ ^/api/v1/expos/[^/]+/rounds(/.*)?$ {
            proxy_pass http://host.docker.internal:8083;
        }

        location /api/v1/expos {
            proxy_pass http://host.docker.internal:8082;
        }

        location /api/v1/channels {
            proxy_pass http://host.docker.internal:8082;
        }

        location /api/v1/rounds {
            proxy_pass http://host.docker.internal:8083;
        }

        location /api/v1/reservations {
            proxy_pass http://host.docker.internal:8083;
        }

        location /api/v1/expo-promotions {
            proxy_pass http://host.docker.internal:8082;
        }

        location /api/v1/tickets {
            proxy_pass http://host.docker.internal:8084;
        }

        location /api/v1/admin/settlement {
            proxy_pass http://host.docker.internal:8086;
        }

        location /internal/ {
            return 404;
        }
    }
}