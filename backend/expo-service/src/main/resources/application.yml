server:
  port: 8082

spring:
  application:
    name: expo-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13306}/expo?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:root}
    # password는 시크릿이므로 application-local.yml(또는 환경변수)에서 채운다
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

internal:
  token: ${INTERNAL_TOKEN:local-dev-internal-token}

recommendation-service:
  base-url: ${RECOMMENDATION_SERVICE_URL:http://localhost:8085}
  connect-timeout: 2s
  read-timeout: 3s

# reservation-service 내부 호출(#24 회차 존재 확인, #26 회차 목록 병합)용. 재시도 없음.
reservation-service:
  base-url: ${RESERVATION_SERVICE_URL:http://localhost:8083}
  connect-timeout: 2s
  read-timeout: 3s

# ticket-service 내부 호출(예약 현황의 회차별 체크인 수). 실패해도 현황은 보여준다.
ticket-service:
  base-url: ${TICKET_SERVICE_URL:http://localhost:8084}
  connect-timeout: 2s
  read-timeout: 3s

scheduler:
  auto-close:
    cron: "0 */10 * * * *"
    limit: 500

  # 환불 실패 재시도(#125). REFUND_FAILED 로 남은 건만 회수한다.
  refund-retry:
    enabled: ${REFUND_RETRY_ENABLED:true}
    cron: "0 * * * * *"
    batch-size: 100
    max-attempts: 6
    backoff: 1m

app:
  base-url: ${APP_BASE_URL:http://localhost:8082}

portone:
  stub: ${PORTONE_STUB:true}
  store-id: ${PORTONE_STORE_ID:store-dev-placeholder}
  channel-key: ${PORTONE_CHANNEL_KEY:channel-key-dev-placeholder}
  api-secret: ${PORTONE_API_SECRET:dev-only-placeholder}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:whsec_ZGV2LW9ubHktcGxhY2Vob2xkZXItbm90LWEtcmVhbC1rZXk=}

banner:
  max-slots: ${BANNER_MAX_SLOTS:10}
  duration-days: ${BANNER_DURATION_DAYS:30}

# 키가 비어 있으면 LLM 호출을 건너뛰고 기능이 폴백으로 돈다. 로컬·CI 는 키 없이 뜬다.
gemini:
  api-key: ${GEMINI_API_KEY:}
  # 방문자가 화면 앞에서 기다리는 호출이라 가장 가벼운 등급을 쓴다.
  # gemini-3.5-flash 는 추론 때문에 read-timeout(10s)을 넘겼고, 2.5 계열은 신규 사용자에게
  # 더 이상 열리지 않는다(404). 모델명은 자주 바뀌니 GEMINI_MODEL 로 덮을 수 있게 둔다.
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  # Gemini 3 계열은 추론을 완전히 끄지 못한다. low 가 최저다 -
  # 문장에서 조건을 뽑는 데 추론은 필요 없으므로 최저로 내린다.
  thinking-level: low
  # 429·503 은 1초 안에 거절이라 한 번 더 보내는 값이 크다. 타임아웃은 클라이언트가
  # 따로 판단해 재시도하지 않으므로, 여기서 2 로 둬도 사용자가 두 배로 기다리지 않는다.
  max-attempts: 2

# 개발·CI 기본값. 실제 값은 JWT_SECRET 환경변수가 덮어쓴다
jwt:
  secret: ${JWT_SECRET:dev-only-not-a-real-secret-0123456789abcdef}
