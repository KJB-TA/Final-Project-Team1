server:
  port: 8081

spring:
  application:
    name: identity-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13306}/identity?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:root}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    placeholders:
      superAdminEmail: ${SUPER_ADMIN_EMAIL:admin@team1.local}
      superAdminPasswordHash: ${SUPER_ADMIN_PASSWORD_HASH:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

jwt:
  # 개발·CI 기본값. 실제 값은 JWT_SECRET 환경변수가 덮어쓴다
  secret: ${JWT_SECRET:dev-only-not-a-real-secret-0123456789abcdef}
  access-token-expiration: 3600000

# 카카오 로그인 인가 코드 교환에 쓰는 REST API 키. 비어 있으면 카카오 로그인만 동작하지 않는다.
# client-secret: 카카오 콘솔에서 REST 키에 클라이언트 시크릿이 켜져 있으면 그 값도 넣어야 토큰이 발급된다.
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
