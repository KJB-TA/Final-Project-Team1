name: CD

# 수동 배포 전용: Actions → CD → Run workflow (브랜치 dev 선택)
# PR 머지로는 배포되지 않는다. 자동 배포로 바꾸려면 아래 주석을 해제한다.
on:
  workflow_dispatch:
  # workflow_run:
  #   workflows: ["CI"]
  #   types: [completed]
  #   branches: [dev]

concurrency:
  group: cd-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/likelion-backend-24th
  DEPLOY_DIR: fpt1

jobs:
  build-and-push:
    # 배포는 dev·main 에서만. 기능 브랜치를 실수로 골라 실행하면 건너뛴다.
    if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      # dev 에는 PR CI(테스트)를 통과한 코드만 머지되므로 jar 만 만든다
      - name: Build jars
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend images
        run: |
          for svc in identity-service expo-service reservation-service ticket-service settlement-service recommendation-service; do
            image="$REGISTRY/fpt1-$svc"
            docker build --build-arg SERVICE=$svc \
              -t "$image:latest" -t "$image:${{ steps.meta.outputs.sha }}" \
              -f backend/Dockerfile backend
            docker push --all-tags "$image"
          done

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_PORTONE_STORE_ID=${{ vars.VITE_PORTONE_STORE_ID }}
            VITE_PORTONE_CHANNEL_KEY=${{ vars.VITE_PORTONE_CHANNEL_KEY }}
            VITE_CLOUDINARY_CLOUD_NAME=${{ vars.VITE_CLOUDINARY_CLOUD_NAME }}
            VITE_CLOUDINARY_UPLOAD_PRESET=${{ vars.VITE_CLOUDINARY_UPLOAD_PRESET }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_NAVER_CLIENT_ID=${{ vars.VITE_NAVER_CLIENT_ID }}
            VITE_KAKAO_REST_KEY=${{ vars.VITE_KAKAO_REST_KEY }}
          tags: |
            ${{ env.REGISTRY }}/fpt1-web:latest
            ${{ env.REGISTRY }}/fpt1-web:${{ steps.meta.outputs.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose & config to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,infra/nginx/nginx.prod.conf,infra/mysql/init.sql"
          target: /home/${{ secrets.EC2_USER }}/${{ env.DEPLOY_DIR }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/${{ env.DEPLOY_DIR }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
